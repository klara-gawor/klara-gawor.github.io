name: Update publications

on:
  schedule:
    - cron: '23 9 * * 1'  # Mondays at 09:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview publications without changing the website
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install BibTeX parser
        run: python -m pip install bibtexparser==1.4.3

      - name: Preview publications
        if: inputs.dry_run == true
        run: python scripts/update_publications.py --dry-run

      - name: Synchronize publications
        if: inputs.dry_run != true
        run: python scripts/update_publications.py

      - name: Commit bibliography changes
        if: inputs.dry_run != true
        run: |
          if git diff --quiet -- _bibliography/papers.bib; then
            echo 'No new publications.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add _bibliography/papers.bib
            git commit -m 'Update publications from ORCID'
            git push origin HEAD:main
          fi

      - name: Rebuild website
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
